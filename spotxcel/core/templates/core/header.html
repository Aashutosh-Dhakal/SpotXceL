<nav class="navbar">
    <div class="nav-container">
        <div class="nav-left">
            <a class="logo" href="{% url 'home' %}">
                <span>Spot</span><span class="logo-accent">XceL</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
                {% if request.session.user_id %}
                <a href="{% if request.session.role == 'admin' %}{% url 'parking_monitoring' %}{% else %}{% url 'user_dashboard' %}{% endif %}" class="{% if request.resolver_match.url_name == 'parking_monitoring' or request.resolver_match.url_name == 'user_management' or request.resolver_match.url_name == 'parking_records' or request.resolver_match.url_name == 'plate_detection_history' or request.resolver_match.url_name == 'edit_plate_detection_history' or request.resolver_match.url_name == 'delete_plate_detection_history' or request.resolver_match.url_name == 'user_dashboard' %}active{% endif %}">Dashboard</a>
                {% endif %}
            </div>
        </div>
        <div class="nav-right">
            {% if request.session.user_id %}
                <a href="{% url 'profile' %}" class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span>{{ request.session.username }}</span>
                </a>
                <a href="{% url 'logout' %}" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link">Login</a>
                <a href="{% url 'signup' %}" class="btn-primary">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>
